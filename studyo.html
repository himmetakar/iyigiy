<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>iyigiy · Kombin stüdyosu</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/ui.css">
<style>
body{overflow-x:hidden}
.studio{display:grid;grid-template-columns:minmax(0,1fr) 400px;height:calc(100vh - var(--navh,67px));min-height:640px}
@media (max-width:1000px){.studio{grid-template-columns:1fr;height:auto}.stage{height:82vh;min-height:560px}}

/* ---- sahne ---- */
.stage{position:relative;overflow:hidden;background:#070605;min-height:620px}
.stage .glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(40% 50% at 50% 30%,rgba(232,208,154,.07),transparent 70%)}
.figure{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);aspect-ratio:1100/1971;max-width:100%}
.figure img.mq{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .6s}
.figure img.mq.fade{opacity:0}
svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
svg.lines path{fill:none;stroke:var(--gold);stroke-width:1;opacity:.75;stroke-dasharray:400;stroke-dashoffset:400;animation:draw 1.1s var(--ease) forwards}
svg.lines circle{fill:var(--gold2)}
@keyframes draw{to{stroke-dashoffset:0}}

.hs{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;z-index:3;display:grid;place-items:center;transition:transform .35s var(--ease),opacity .4s}
.hs::before{content:"";position:absolute;inset:7px;border-radius:50%;background:rgba(11,10,9,.55);backdrop-filter:blur(6px);box-shadow:0 0 0 1px var(--gold),0 6px 18px rgba(0,0,0,.6)}
.hs::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 1px rgba(201,164,92,.5);animation:pulse 2.6s ease-out infinite}
.hs i{position:relative;font-style:normal;color:var(--gold2);font-size:19px;font-weight:300;line-height:1}
.hs:hover{transform:scale(1.12)}
.hs .tip{position:absolute;top:50%;transform:translateY(-50%);white-space:nowrap;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold2);
  background:rgba(11,10,9,.72);backdrop-filter:blur(8px);border:1px solid var(--line);padding:7px 11px;border-radius:99px;pointer-events:none;opacity:0;transition:opacity .25s}
.hs.l .tip{right:calc(100% + 6px)}.hs.r .tip{left:calc(100% + 6px)}
.hs:hover .tip,.stage.hint .hs .tip{opacity:1}
.hs.filled::after{display:none}
.hs.filled{width:16px;height:16px;margin:-8px 0 0 -8px}
.hs.filled::before{inset:3px;background:var(--gold2);box-shadow:0 0 0 3px rgba(201,164,92,.25),0 0 14px rgba(232,208,154,.6)}
.hs.filled i,.hs.filled .tip{display:none}
.hs.off{opacity:.18;pointer-events:none}
.hs.hidden{opacity:0;pointer-events:none;transform:scale(.4)}
@keyframes pulse{0%{transform:scale(.7);opacity:1}100%{transform:scale(1.35);opacity:0}}

.callout{position:absolute;z-index:4;width:var(--cw,150px);transform:translateY(-50%);animation:cin .7s var(--ease) both}
@keyframes cin{from{opacity:0;transform:translateY(-50%) scale(.92)}}
.callout .card2{background:rgba(19,17,15,.86);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.55);transition:border-color .3s}
.callout:hover .card2{border-color:var(--gold)}
.callout .im{aspect-ratio:3/4;background:#1c1a17 center/cover;position:relative}
.callout .im .acts{position:absolute;inset:auto 6px 6px 6px;display:flex;gap:6px;opacity:0;transition:opacity .25s}
.callout:hover .im .acts,.callout:focus-within .im .acts{opacity:1}
.callout .acts button{flex:1;font-size:10.5px;letter-spacing:.08em;padding:7px 4px;border-radius:99px;background:rgba(11,10,9,.82);color:var(--gold2);border:1px solid var(--line)}
.callout .acts button:hover{border-color:var(--gold)}
.callout .acts button[data-rm]{flex:0 0 30px;padding:7px 0}
@media (max-width:640px){.callout .mt{padding:7px 8px 8px}.callout .mt .lab{letter-spacing:.1em}.callout .mt b{font-size:11.5px}}
.callout .mt{padding:9px 11px 10px}
.callout .mt .lab{font-size:9px;letter-spacing:.2em}
.callout .mt b{display:block;font-weight:500;font-size:12.5px;line-height:1.3;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.callout .mt span{display:block;font-size:12px;color:var(--gold2);margin-top:3px}
.callout .mt span.x{color:var(--soft)}
@media (hover:none){.callout .im .acts{opacity:1}}

.gtoggle{position:absolute;left:20px;top:20px;z-index:6;display:flex;background:rgba(11,10,9,.7);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:99px;padding:4px}
.gtoggle button{padding:8px 16px;border-radius:99px;font-size:12px;letter-spacing:.1em;color:var(--soft)}
.gtoggle button.on{background:var(--gold);color:#14110c}
.stotal{position:absolute;right:20px;top:20px;z-index:6;text-align:right;background:rgba(11,10,9,.6);backdrop-filter:blur(8px);border:1px solid var(--line2);border-radius:14px;padding:10px 16px}
.stotal b{display:block;font-family:var(--serif);font-weight:400;font-size:24px;color:var(--gold2);margin-top:2px}

/* ---- adım paneli ---- */
.panel{border-left:1px solid var(--line2);background:var(--bg2);display:flex;flex-direction:column;min-height:0}
@media (max-width:1000px){.panel{border-left:0;border-top:1px solid var(--line2);max-height:none;position:static}}
.steps{display:flex;gap:6px;padding:22px 28px 0}
.steps i{flex:1;height:2px;border-radius:2px;background:var(--line2);transition:background .5s}
.steps i.on{background:var(--gold)}
.pbody{flex:1;overflow-y:auto;padding:24px 28px 28px}
.pbody h2{font-size:30px;margin:10px 0 10px}
.pbody .lead{color:var(--soft);font-size:14px;line-height:1.7}
.pfoot{padding:18px 28px 24px;border-top:1px solid var(--line2);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pfoot .btn{flex:1}
.plist{margin-top:20px;display:grid;gap:8px}
.pitem{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:8px;border:1px solid var(--line2);border-radius:12px;font-size:13px}
.pitem img{width:44px;height:58px;object-fit:cover;border-radius:6px}
.pitem small{display:block;color:var(--soft);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:3px}
.pitem .p{color:var(--gold2);font-variant-numeric:tabular-nums}
.pitem.open{grid-template-columns:44px 1fr;color:var(--mute);cursor:pointer;border-style:dashed}
.pitem.open:hover{border-color:var(--line);color:var(--soft)}
.pitem.open .ph{width:44px;height:58px;border-radius:6px;border:1px dashed var(--line);display:grid;place-items:center;color:var(--gold)}
.sum{margin-top:18px;padding:14px 16px;border-radius:12px;background:rgba(201,164,92,.05);border:1px solid var(--line);font-size:13px;line-height:1.8}
.sum b{color:var(--gold2);font-family:var(--serif);font-weight:400;font-size:20px}
.sugs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:20px}
.sug{position:relative;text-align:left;border:1px solid var(--line2);border-radius:12px;overflow:hidden;background:var(--bg);transition:border-color .25s,transform .3s var(--ease)}
.sug:hover{border-color:var(--line);transform:translateY(-2px)}
.sug.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.sug .im{aspect-ratio:3/4;background:#1c1a17 center/cover}
.sug .mt{padding:9px 11px 11px;font-size:12.5px;line-height:1.35}
.sug .mt span{display:block;color:var(--gold2);margin-top:3px}
.sug .ck{position:absolute;right:8px;top:8px;width:24px;height:24px;border-radius:50%;background:rgba(11,10,9,.7);border:1px solid var(--gold3);display:grid;place-items:center;font-size:12px;color:transparent}
.sug.on .ck{background:var(--gold);color:#14110c;border-color:var(--gold)}
.sug .bd{position:absolute;left:8px;top:8px;font-size:9px;letter-spacing:.18em;text-transform:uppercase;background:var(--bg);color:var(--gold2);border:1px solid var(--gold3);padding:4px 7px}

/* ---- seçim çekmecesi ---- */
.drawer{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .35s}
.drawer.on{opacity:1;pointer-events:auto}
.drawer .sh{position:absolute;right:0;top:0;bottom:0;width:min(520px,100vw);background:var(--bg2);border-left:1px solid var(--line);display:flex;flex-direction:column;
  transform:translateX(50px);transition:transform .55s var(--ease)}
.drawer.on .sh{transform:none}
@media (max-width:640px){.drawer .sh{top:auto;height:88vh;width:100vw;border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;transform:translateY(40px)}}
.drawer .hd{padding:24px 26px 16px;border-bottom:1px solid var(--line2)}
.drawer .hd h3{font-family:var(--serif);font-size:30px;margin-top:8px}
.drawer .hd .x{position:absolute;right:16px;top:16px;width:38px;height:38px;border-radius:50%;background:rgba(242,236,225,.06)}
.drawer .tools{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.drawer .tools .in{flex:1;min-width:160px;padding:10px 14px}
.drawer .colors{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.drawer .colors button{font-size:11.5px;padding:6px 12px;border-radius:99px;border:1px solid var(--line2);color:var(--soft)}
.drawer .colors button.on{border-color:var(--gold);color:var(--gold2)}
.drawer .grid2{flex:1;overflow-y:auto;padding:18px 26px 30px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-content:start}
@media (min-width:900px){.drawer .grid2{grid-template-columns:repeat(3,minmax(0,1fr))}.drawer .sh{width:min(700px,100vw)}}
.drawer .none{grid-column:1/-1}
.locked{max-width:560px;margin:12vh auto;text-align:center}
.done{text-align:center;padding-top:10px}
.done .seal{width:64px;height:64px;margin:6px auto 0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f6e6b4,#c9a45c 45%,#6e5426);box-shadow:0 10px 30px rgba(201,164,92,.25);display:grid;place-items:center;color:#14110c;font-size:26px}
.upl{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;margin-top:16px}
.upl .pv{width:96px;aspect-ratio:3/4;border-radius:10px;border:1px dashed var(--line);background:#1c1a17 center/cover;display:grid;place-items:center;color:var(--gold);font-size:24px;cursor:pointer}
.consent{margin-top:14px;font-size:12px;color:var(--soft);line-height:1.65;background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:12px 14px}
</style>
</head>
<body>
<div id="nav"></div>
<main id="root"><div class="spin"></div></main>
<div class="drawer" id="dr"><div class="sh"><div class="hd"><button class="x" id="drx" aria-label="Kapat">✕</button><div class="lab" id="drl"></div><h3 id="drt"></h3>
  <div class="tools"><input class="in" id="drq" placeholder="Ürün ara"><select class="in" id="drs" style="max-width:170px"><option value="uyum">En uyumlu</option><option value="asc">Fiyat artan</option><option value="desc">Fiyat azalan</option></select></div>
  <div class="colors" id="drc"></div></div><div class="grid2" id="drg"></div></div></div>
<script type="module" src="/js/studyo.js"></script>
</body>
</html>
