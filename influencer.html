<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iyigiy · Influencer paneli</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/ui.css">
<style>
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:center}
@media (max-width:900px){.hero{grid-template-columns:1fr}}
.linkbox{display:flex;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 14px;font-size:13.5px}
.linkbox code{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--gold2)}
.klink{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line2)}
.klink .im{width:54px;height:72px;border-radius:6px;background:#1c1a17 center/cover}
.ranges{display:flex;gap:6px}
.ranges button{padding:8px 14px;border-radius:99px;font-size:12.5px;color:var(--soft);border:1px solid var(--line2)}
.ranges button.on{color:#14110c;background:var(--gold);border-color:var(--gold)}
.storecard{margin-top:22px;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;border:1px solid var(--line);border-radius:16px;
  padding:clamp(20px,3vw,32px);background:radial-gradient(80% 140% at 100% 0%,rgba(201,164,92,.12),transparent 60%),var(--bg2)}
.linkbox .btn.ghost{flex:none}
.avup{display:grid;grid-template-columns:84px 1fr;gap:16px;align-items:center}
.avup .av{width:84px;height:84px;border-radius:50%;background:#1c1a17 center/cover;box-shadow:0 0 0 1px var(--gold3);display:grid;place-items:center;color:var(--gold);font-size:24px;cursor:pointer}
.upl{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;margin-top:16px}
.upl .pv{width:96px;aspect-ratio:3/4;border-radius:10px;border:1px dashed var(--line);background:#1c1a17 center/cover;display:grid;place-items:center;color:var(--gold);font-size:24px;cursor:pointer}
.consent{margin-top:14px;font-size:12px;color:var(--soft);line-height:1.65;background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:12px 14px}
.quota-bar{margin-bottom:20px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--bg2)}
.quota-bar>div{height:4px;border-radius:4px;background:var(--line2);overflow:hidden}
.quota-bar>div span{display:block;height:100%;background:linear-gradient(90deg,var(--gold3),var(--gold2))}
.quota-bar p{font-size:13px;color:var(--soft);margin-top:10px;line-height:1.6}.quota-bar b{color:var(--gold2)}
.kcard [data-tp]:empty{display:none}
.big{font-family:var(--serif);font-size:clamp(30px,3.4vw,46px);color:var(--gold2)}
</style>
</head>
<body>
<div id="nav"></div>
<main class="wrap" id="root"><div class="spin"></div></main>
<script type="module" src="/js/influencer.js"></script>
</body>
</html>
