<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iyigiy · Kombin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/ui.css">
<style>
.kd{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(24px,4vw,60px);align-items:start}
@media (max-width:860px){.kd{grid-template-columns:1fr}}
.kd .hero{aspect-ratio:9/16;max-height:82vh;border-radius:16px;background:#1c1a17 center/cover no-repeat;position:sticky;top:90px;border:1px solid var(--line2)}
@media (max-width:860px){.kd .hero{position:static;max-height:70vh;margin:0 auto;width:100%}}
.pcs{display:grid;gap:12px;margin-top:22px}
.pc{display:grid;grid-template-columns:84px 1fr 130px;gap:16px;align-items:center;padding:12px;border:1px solid var(--line2);border-radius:12px;background:var(--bg2)}
.pc img{width:84px;height:110px;object-fit:cover;border-radius:8px;cursor:zoom-in}
@media (max-width:520px){.pc{grid-template-columns:70px 1fr}.pc select{grid-column:2}}
.pair .pc{background:var(--bg)}
.gal{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory}
.gal img{height:60vh;border-radius:10px;scroll-snap-align:center}
.seal{display:flex;gap:12px;align-items:center;font-size:13px;color:var(--soft);margin-top:20px}
.seal i{flex:0 0 26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f6e6b4,#c9a45c 45%,#6e5426)}
</style>
</head>
<body>
<div id="nav"></div>
<main class="wrap" id="root"><div class="spin"></div></main>
<div class="modal" id="modal"><div class="box" style="width:min(1000px,100%)"><button class="x" onclick="document.getElementById('modal').classList.remove('on')">✕</button><div id="mbody"></div></div></div>
<script type="module" src="/js/kombin.js"></script>
</body>
</html>
