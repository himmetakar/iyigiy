<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iyigiy · Sepet</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/ui.css">
<style>
.lay{display:grid;grid-template-columns:1fr 400px;gap:28px;align-items:start}
@media (max-width:960px){.lay{grid-template-columns:1fr}}
.ci{display:grid;grid-template-columns:110px 1fr;gap:18px;margin-bottom:16px}
.ci .im{aspect-ratio:9/16;border-radius:10px;background:#1c1a17 center/cover no-repeat}
.ci .pp{display:grid;grid-template-columns:1fr 110px 100px;gap:10px;align-items:center;font-size:13.5px;padding:9px 0;border-top:1px solid var(--line2)}
.ci .pp select{padding:7px 10px}
.sum .r{display:flex;justify-content:space-between;padding:8px 0;font-size:14px}
.sum .t{font-family:var(--serif);font-size:30px;color:var(--gold2)}
.brands{display:grid;gap:6px;margin-top:12px}
.brands div{display:flex;justify-content:space-between;font-size:13px;padding:8px 12px;background:var(--bg);border-radius:8px}
.seal{display:flex;gap:12px;align-items:center}
.seal i{flex:0 0 30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f6e6b4,#c9a45c 45%,#6e5426)}
.note{font-size:12.5px;line-height:1.6;color:var(--warn);background:rgba(217,177,92,.08);border:1px solid rgba(217,177,92,.25);border-radius:10px;padding:12px 14px}
</style>
</head>
<body>
<div id="nav"></div>
<main class="wrap" id="root"><div class="spin"></div></main>
<div class="modal" id="modal"><div class="box"><button class="x" onclick="document.getElementById('modal').classList.remove('on')">✕</button><div id="mbody"></div></div></div>
<script type="module" src="/js/sepet.js"></script>
</body>
</html>
